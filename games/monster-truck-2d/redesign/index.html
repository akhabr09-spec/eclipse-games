<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monster Truck - UI Redesign</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0a0a12;
  --bg-metal: #1a1a2e;
  --bg-surface: #16162a;
  --bg-panel: rgba(26,26,46,0.92);
  --bg-card: rgba(22,22,40,0.85);
  --accent: #ff6b35;
  --accent-dim: #cc5522;
  --accent-glow: rgba(255,107,53,0.25);
  --red: #ff3333;
  --green: #33ff66;
  --gold: #ffd700;
  --text: #ffffff;
  --text-dim: #8888aa;
  --text-muted: #555577;
  --border: rgba(255,255,255,0.06);
  --border-light: rgba(255,255,255,0.12);
  --font-head: 'Bebas Neue', sans-serif;
  --font-body: 'Rajdhani', sans-serif;
  --ts: 0.45s;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  overflow:hidden;
  background:var(--bg-dark);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

/* ─── Screens Container ─── */
.screens { position:relative; width:100%; height:100%; }
.screen, .overlay {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transition: opacity var(--ts) ease, transform var(--ts) ease;
  will-change:opacity,transform;
}
.screen.active, .overlay.active { opacity:1; pointer-events:auto; }
.screen.exit-left { opacity:0; transform:translateX(-60px); }
.screen.exit-right { opacity:0; transform:translateX(60px); }
.screen.enter-left { opacity:0; transform:translateX(-60px); }
.screen.enter-right { opacity:0; transform:translateX(60px); }

/* ─── Particles ─── */
.particles { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
.particle {
  position:absolute; width:3px; height:3px;
  background:rgba(255,255,255,0.15); border-radius:50%;
  animation:particleFloat 8s infinite;
}
@keyframes particleFloat {
  0%{ transform:translateY(100vh) translateX(0); opacity:0; }
  10%{ opacity:1; }
  90%{ opacity:1; }
  100%{ transform:translateY(-10vh) translateX(50px); opacity:0; }
}

/* ─── Common Components ─── */
.btn {
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  padding:14px 36px; border:none; border-radius:8px;
  font-family:var(--font-head); font-size:20px; letter-spacing:1.5px;
  color:var(--text); cursor:pointer;
  background:var(--bg-metal); border:1px solid var(--border);
  overflow:hidden; transition:transform 0.2s, box-shadow 0.2s, background 0.2s;
  text-transform:uppercase; text-decoration:none;
}
.btn::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.06),transparent);
  transform:translateX(-100%); transition:transform 0.6s;
}
.btn:hover::before { transform:translateX(100%); }
.btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(0,0,0,0.4); }
.btn:active { transform:translateY(0) scale(0.97); }
.btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent-dim); box-shadow:0 8px 25px var(--accent-glow); }
.btn-ghost { background:transparent; border-color:var(--border-light); color:var(--text-dim); }
.btn-ghost:hover { background:var(--bg-metal); color:var(--text); }
.btn-sm { padding:10px 24px; font-size:16px; }
.btn-icon { width:44px; height:44px; padding:0; border-radius:50%; }

.back-btn {
  position:absolute; top:24px; left:24px; z-index:10;
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-body); font-size:16px; font-weight:600;
  color:var(--text-dim); cursor:pointer; background:none; border:none;
  transition:color 0.2s, transform 0.2s;
}
.back-btn:hover { color:var(--accent); transform:translateX(-4px); }
.back-btn svg { width:20px; height:20px; fill:currentColor; }

.page-title {
  font-family:var(--font-head); font-size:48px; letter-spacing:3px;
  color:var(--text); text-transform:uppercase; margin-bottom:8px;
}
.page-subtitle {
  font-family:var(--font-body); font-size:18px; font-weight:500;
  color:var(--text-dim); letter-spacing:1px;
}

/* ─── Loading Screen ─── */
#screen-loading { z-index:100; background:var(--bg-dark); }
.loading-content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:24px; }
.loading-tire { width:80px; height:80px; animation:tireSpin 1.2s linear infinite; }
@keyframes tireSpin { to { transform:rotate(360deg); } }
.loading-title { font-family:var(--font-head); font-size:52px; letter-spacing:6px; color:var(--text); text-transform:uppercase; }
.loading-title span { color:var(--accent); }
.loading-sub { font-family:var(--font-body); font-size:16px; color:var(--text-dim); letter-spacing:4px; font-weight:500; }
.loading-bar-wrap { width:280px; height:3px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; margin-top:8px; }
.loading-bar-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--accent-dim),var(--accent)); border-radius:2px; transition:width 0.1s linear; }
.loading-version { position:absolute; bottom:24px; right:24px; font-size:12px; color:var(--text-muted); letter-spacing:1px; }

/* ─── Main Menu ─── */
#screen-menu { background:linear-gradient(180deg,#0a0a12 0%,#0e0e1a 40%,#141428 70%,#1a1a30 100%); }
.menu-bg-bottom {
  position:absolute; bottom:0; left:0; right:0; height:35%;
  background:linear-gradient(0deg,rgba(26,26,46,0.6),transparent);
  pointer-events:none; z-index:0;
}
.menu-bg-terrain {
  position:absolute; bottom:0; left:0; right:0; height:200px; z-index:0; overflow:hidden;
}
.menu-bg-terrain svg { position:absolute; bottom:0; left:0; width:100%; height:180px; }
.menu-content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:20px; }
.menu-logo { text-align:center; }
.menu-logo h1 { font-family:var(--font-head); font-size:86px; letter-spacing:8px; line-height:0.9; color:var(--text); text-shadow:0 0 40px rgba(255,107,53,0.15),0 0 80px rgba(255,107,53,0.05); }
.menu-logo h1 span { color:var(--accent); }
.menu-logo p { font-family:var(--font-body); font-size:18px; font-weight:500; color:var(--text-dim); letter-spacing:6px; margin-top:8px; }
.menu-buttons { display:flex; flex-direction:column; gap:12px; margin-top:16px; width:260px; }
.menu-buttons .btn { width:100%; }
.menu-sound {
  position:absolute; top:24px; right:24px; z-index:10;
  width:44px; height:44px; border-radius:50%; border:1px solid var(--border);
  background:var(--bg-panel); cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:border-color 0.2s, background 0.2s;
}
.menu-sound:hover { border-color:var(--accent); background:rgba(255,107,53,0.1); }
.menu-sound svg { width:20px; height:20px; fill:var(--text-dim); }
.menu-sound.muted svg { fill:var(--text-muted); }
.menu-sound.muted::after { content:''; position:absolute; width:24px; height:2px; background:var(--red); transform:rotate(45deg); }

/* ─── Garage ─── */
#screen-garage { background:linear-gradient(180deg,#0a0a12,#111122); }
.garage-content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; width:100%; max-width:720px; padding:80px 40px 40px; }
.garage-header { display:flex; align-items:center; gap:20px; margin-bottom:24px; }
.garage-arrow {
  width:48px; height:48px; border-radius:50%; border:1px solid var(--border);
  background:var(--bg-card); cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all 0.2s; font-size:20px; color:var(--text);
}
.garage-arrow:hover { border-color:var(--accent); background:rgba(255,107,53,0.1); }
.garage-truck-wrap { width:360px; height:200px; display:flex; align-items:center; justify-content:center; }
.garage-truck-name { font-family:var(--font-head); font-size:36px; letter-spacing:3px; color:var(--text); margin-bottom:4px; }
.garage-truck-class { font-size:14px; color:var(--text-dim); letter-spacing:2px; font-weight:500; margin-bottom:24px; }
.garage-stats { width:100%; max-width:400px; display:flex; flex-direction:column; gap:12px; margin-bottom:28px; }
.stat-row { display:flex; align-items:center; gap:12px; }
.stat-label { width:60px; font-size:14px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
.stat-track { flex:1; height:6px; background:rgba(255,255,255,0.06); border-radius:3px; overflow:hidden; }
.stat-fill { height:100%; border-radius:3px; transition:width 0.8s cubic-bezier(0.34,1.56,0.64,1); }
.stat-num { width:30px; text-align:right; font-size:14px; font-weight:700; color:var(--text-dim); }
.garage-buttons { display:flex; gap:12px; }
.garage-price { font-family:var(--font-head); font-size:22px; color:var(--gold); letter-spacing:2px; }
.garage-price span { font-size:16px; }

/* ─── Level Select ─── */
#screen-levels { background:linear-gradient(135deg,#0a0a12,#0e0e1e,#0a0a12); }
.levels-content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; width:100%; height:100%; padding:80px 40px 40px; }
.levels-progress { font-size:15px; color:var(--text-dim); font-weight:500; letter-spacing:1px; margin-bottom:20px; }
.levels-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
  width:100%; max-width:660px; overflow-y:auto; flex:1; padding:8px 4px 120px;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
.levels-grid::-webkit-scrollbar { width:4px; }
.levels-grid::-webkit-scrollbar-track { background:transparent; }
.levels-grid::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.level-card {
  position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px 16px; border-radius:10px; cursor:pointer;
  background:var(--bg-card); border:1px solid var(--border);
  transition:all 0.25s; gap:6px; min-height:110px;
}
.level-card:hover:not(.locked) { border-color:var(--accent); transform:translateY(-4px); box-shadow:0 12px 30px rgba(0,0,0,0.4); }
.level-card.locked { opacity:0.4; cursor:not-allowed; }
.level-card.completed { border-color:rgba(255,215,0,0.2); }
.level-num { font-family:var(--font-head); font-size:32px; letter-spacing:2px; }
.level-name { font-size:13px; color:var(--text-dim); font-weight:500; }
.level-stars { display:flex; gap:3px; }
.level-stars svg { width:16px; height:16px; }
.level-lock { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:28px; height:28px; }
.level-lock svg { width:100%; height:100%; fill:var(--text-muted); }

/* ─── HUD ─── */
#screen-hud { background:linear-gradient(180deg,#050510 0%,#0a0a18 30%,#0e0e20 60%,#141430 100%); justify-content:flex-start; }
.hud-bg {
  position:absolute; inset:0; z-index:0;
  background:radial-gradient(ellipse at 50% 80%,rgba(255,107,53,0.04) 0%,transparent 60%);
  pointer-events:none;
}
.hud-track-surface {
  position:absolute; bottom:0; left:0; right:0; height:40%;
  background:linear-gradient(0deg,#1a1a30 0%,rgba(26,26,46,0.4) 40%,transparent 100%);
  pointer-events:none; z-index:0;
}
.hud-top-bar {
  position:relative; z-index:2; width:100%; padding:16px 24px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg,rgba(10,10,18,0.9) 0%,transparent 100%);
}
.hud-item { display:flex; align-items:center; gap:8px; }
.hud-icon { width:22px; height:22px; }
.hud-icon svg { width:100%; height:100%; fill:var(--text); }
.hud-timer { font-family:var(--font-head); font-size:28px; letter-spacing:2px; color:var(--text); }
.hud-timer.urgent { color:var(--red); animation:pulse 1s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
.hud-fuel-wrap { width:120px; height:6px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; }
.hud-fuel-fill { height:100%; border-radius:3px; transition:width 0.3s; }
.hud-fuel-fill.caution { background:var(--accent); }
.hud-fuel-fill.danger { background:var(--red); animation:pulse 1s ease infinite; }
.hud-coins { font-family:var(--font-head); font-size:22px; letter-spacing:2px; color:var(--gold); }
.hud-bottom-bar {
  position:absolute; bottom:0; left:0; right:0; z-index:2;
  padding:16px 24px; display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(0deg,rgba(10,10,18,0.9) 0%,transparent 100%);
}
.hud-speed { display:flex; align-items:baseline; gap:4px; }
.hud-speed-val { font-family:var(--font-head); font-size:42px; letter-spacing:2px; color:var(--accent); line-height:1; }
.hud-speed-unit { font-size:14px; color:var(--text-dim); font-weight:500; }
.hud-pause { width:44px; height:44px; border-radius:8px; border:1px solid var(--border); background:var(--bg-panel); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
.hud-pause:hover { border-color:var(--accent); background:rgba(255,107,53,0.1); }
.hud-pause svg { width:18px; height:18px; fill:var(--text); }
.hud-finish {
  position:absolute; bottom:90px; left:50%; transform:translateX(-50%); z-index:3;
  padding:10px 28px; border-radius:20px; border:2px solid var(--gold);
  background:rgba(255,215,0,0.1); color:var(--gold);
  font-family:var(--font-head); font-size:16px; letter-spacing:2px;
  cursor:pointer; transition:all 0.3s; opacity:0; pointer-events:none;
}
.hud-finish.visible { opacity:1; pointer-events:auto; }
.hud-finish:hover { background:rgba(255,215,0,0.2); box-shadow:0 0 30px rgba(255,215,0,0.15); }

/* ─── Pause Overlay ─── */
#screen-pause { z-index:50; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); background:rgba(0,0,0,0.6); }
.pause-modal {
  display:flex; flex-direction:column; align-items:center; gap:16px;
  padding:48px 56px; border-radius:16px;
  background:var(--bg-panel); border:1px solid var(--border);
  box-shadow:0 24px 60px rgba(0,0,0,0.6);
  transform:scale(0.9); transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
#screen-pause.active .pause-modal { transform:scale(1); }
.pause-title { font-family:var(--font-head); font-size:40px; letter-spacing:4px; color:var(--text); margin-bottom:8px; }
.pause-buttons { display:flex; flex-direction:column; gap:10px; width:220px; }
.pause-buttons .btn { width:100%; }

/* ─── Level Complete ─── */
#screen-complete { background:rgba(0,0,0,0.85); z-index:40; }
.complete-modal {
  display:flex; flex-direction:column; align-items:center; gap:12px;
  padding:48px 56px; border-radius:16px;
  background:var(--bg-panel); border:1px solid var(--border);
  box-shadow:0 24px 60px rgba(0,0,0,0.6);
  transform:scale(0.9); opacity:0;
  transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s;
}
#screen-complete.active .complete-modal { transform:scale(1); opacity:1; }
.complete-title { font-family:var(--font-head); font-size:44px; letter-spacing:5px; }
.complete-title.win { color:var(--gold); }
.complete-title.lose { color:var(--red); }
.complete-trophy { width:60px; height:60px; margin-bottom:4px; }
.complete-trophy svg { width:100%; height:100%; }
.complete-stars { display:flex; gap:8px; margin:8px 0; }
.complete-stars svg { width:32px; height:32px; }
.complete-stars svg.dim { opacity:0.15; }
.complete-stats { display:flex; gap:32px; margin:12px 0 20px; }
.complete-stat { text-align:center; }
.complete-stat-val { font-family:var(--font-head); font-size:28px; letter-spacing:2px; color:var(--text); }
.complete-stat-label { font-size:13px; color:var(--text-dim); font-weight:500; letter-spacing:1px; text-transform:uppercase; }
.complete-buttons { display:flex; flex-direction:column; gap:10px; width:240px; }
.complete-buttons .btn { width:100%; }

/* ─── Confetti ─── */
.confetti-container { position:fixed; inset:0; pointer-events:none; z-index:100; overflow:hidden; }
.confetti-piece {
  position:absolute; width:8px; height:8px; top:-10px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall {
  0%{ transform:translateY(0) rotateZ(0deg); opacity:1; }
  100%{ transform:translateY(110vh) rotateZ(720deg); opacity:0; }
}

/* ─── Responsive ─── */
@media (max-width:768px) {
  .menu-logo h1 { font-size:52px; letter-spacing:4px; }
  .menu-buttons { width:220px; }
  .btn { padding:12px 28px; font-size:17px; }
  .levels-grid { grid-template-columns:repeat(2,1fr); gap:12px; padding:8px 16px 100px; }
  .garage-truck-wrap { width:240px; height:150px; }
  .garage-truck-name { font-size:28px; }
  .garage-content { padding:70px 20px 30px; }
  .page-title { font-size:36px; }
  .complete-modal { padding:32px 28px; width:90%; }
  .pause-modal { padding:36px 32px; width:90%; }
  .hud-top-bar { padding:12px 16px; }
  .hud-bottom-bar { padding:12px 16px; }
  .loading-title { font-size:36px; }
}
@media (max-width:480px) {
  .levels-grid { grid-template-columns:repeat(2,1fr); gap:8px; }
  .menu-logo h1 { font-size:38px; }
  .menu-buttons { width:190px; }
  .btn { padding:10px 20px; font-size:15px; }
  .garage-truck-wrap { width:180px; height:120px; }
  .hud-timer { font-size:22px; }
  .hud-speed-val { font-size:30px; }
  .hud-fuel-wrap { width:80px; }
}
@media (min-height:800px) {
  .levels-grid { max-width:720px; }
  .level-card { min-height:130px; padding:24px 20px; }
}
</style>
</head>
<body>
<div class="screens">

<!-- ═══ LOADING ═══ -->
<div id="screen-loading" class="screen active">
  <div class="particles"></div>
  <div class="loading-content">
    <svg class="loading-tire" viewBox="0 0 80 80" fill="none">
      <circle cx="40" cy="40" r="28" stroke="var(--accent)" stroke-width="3" fill="none" opacity="0.3"/>
      <circle cx="40" cy="40" r="20" stroke="var(--accent)" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
      <circle cx="40" cy="40" r="6" fill="var(--accent)"/>
      <path d="M40 8 L42 16 L38 16 Z" fill="var(--accent)"/>
      <path d="M40 72 L42 64 L38 64 Z" fill="var(--accent)"/>
      <path d="M8 40 L16 38 L16 42 Z" fill="var(--accent)"/>
      <path d="M72 40 L64 38 L64 42 Z" fill="var(--accent)"/>
    </svg>
    <div class="loading-title">Monster <span>Truck</span></div>
    <div class="loading-sub">Offroad Championship</div>
    <div class="loading-bar-wrap"><div class="loading-bar-fill" id="loadingBar"></div></div>
  </div>
  <div class="loading-version">UI REDESIGN v1.0</div>
</div>

<!-- ═══ MAIN MENU ═══ -->
<div id="screen-menu" class="screen">
  <div class="particles"></div>
  <div class="menu-bg-bottom"></div>
  <div class="menu-bg-terrain">
    <svg viewBox="0 0 1200 200" preserveAspectRatio="none" fill="none">
      <path d="M0 200 Q150 120 300 160 Q450 80 600 130 Q750 60 900 110 Q1050 70 1200 100 L1200 200 Z" fill="rgba(26,26,46,0.5)"/>
      <path d="M0 200 Q200 140 400 170 Q600 100 800 150 Q1000 90 1200 120 L1200 200 Z" fill="rgba(22,22,40,0.4)"/>
    </svg>
  </div>
  <div class="menu-content">
    <div class="menu-logo">
      <h1>Monster <span>Truck</span></h1>
      <p>Offroad Championship</p>
    </div>
    <div class="menu-buttons">
      <button class="btn btn-primary" onclick="navigate('screen-levels','forward')">Play</button>
      <button class="btn" onclick="navigate('screen-garage','forward')">Garage</button>
      <button class="btn btn-ghost" onclick="showSettings()">Settings</button>
    </div>
  </div>
  <button class="menu-sound" id="soundBtn" onclick="toggleSound()" title="Toggle Sound">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8.5v7a4.49 4.49 0 002.5-3.5zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
  </button>
</div>

<!-- ═══ GARAGE ═══ -->
<div id="screen-garage" class="screen">
  <div class="particles"></div>
  <button class="back-btn" onclick="navigate('screen-menu','back')">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    Back
  </button>
  <div class="garage-content">
    <div class="garage-header">
      <button class="garage-arrow" onclick="prevTruck()">&#8249;</button>
      <div class="garage-truck-wrap" id="truckDisplay">
        <svg id="truckSvg" viewBox="0 0 360 180" fill="none">
          <path d="M60 130 L90 80 L140 70 L200 65 L260 70 L280 75 L300 80 L310 100 L310 130 Z" fill="var(--bg-metal)" stroke="var(--border-light)" stroke-width="2"/>
          <rect x="100" y="75" width="80" height="35" rx="4" fill="rgba(255,255,255,0.04)"/>
          <rect x="110" y="78" width="25" height="15" rx="2" fill="rgba(255,107,53,0.15)"/>
          <path d="M140 110 L160 130 L200 130 L170 110 Z" fill="rgba(255,107,53,0.2)" stroke="var(--accent)" stroke-width="1"/>
          <circle cx="90" cy="140" r="28" fill="#111" stroke="var(--border-light)" stroke-width="2"/>
          <circle cx="90" cy="140" r="20" fill="#1a1a2e" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
          <circle cx="90" cy="140" r="8" fill="#333"/>
          <line x1="90" y1="112" x2="90" y2="120" stroke="var(--border-light)" stroke-width="2"/>
          <line x1="90" y1="160" x2="90" y2="168" stroke="var(--border-light)" stroke-width="2"/>
          <line x1="62" y1="140" x2="70" y2="140" stroke="var(--border-light)" stroke-width="2"/>
          <line x1="110" y1="140" x2="118" y2="140" stroke="var(--border-light)" stroke-width="2"/>
          <circle cx="270" cy="140" r="28" fill="#111" stroke="var(--border-light)" stroke-width="2"/>
          <circle cx="270" cy="140" r="20" fill="#1a1a2e" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
          <circle cx="270" cy="140" r="8" fill="#333"/>
          <line x1="270" y1="112" x2="270" y2="120" stroke="var(--border-light)" stroke-width="2"/>
          <line x1="270" y1="160" x2="270" y2="168" stroke="var(--border-light)" stroke-width="2"/>
          <line x1="242" y1="140" x2="250" y2="140" stroke="var(--border-light)" stroke-width="2"/>
          <line x1="290" y1="140" x2="298" y2="140" stroke="var(--border-light)" stroke-width="2"/>
          <path d="M195 70 L195 45 L210 45 L220 60 L220 70 Z" fill="var(--accent)" stroke="var(--accent-dim)" stroke-width="1" opacity="0.6"/>
          <path d="M225 70 L225 50 L240 50 L240 70 Z" fill="var(--accent)" stroke="var(--accent-dim)" stroke-width="1" opacity="0.4"/>
          <rect x="295" y="90" width="15" height="40" rx="3" fill="#333" stroke="var(--border-light)" stroke-width="1"/>
        </svg>
      </div>
      <button class="garage-arrow" onclick="nextTruck()">&#8250;</button>
    </div>
    <div class="garage-truck-name" id="truckName">Monster Fury</div>
    <div class="garage-truck-class" id="truckClass">Class A - Offroad</div>
    <div class="garage-stats" id="garageStats"></div>
    <div class="garage-buttons" id="garageButtons"></div>
  </div>
</div>

<!-- ═══ LEVEL SELECT ═══ -->
<div id="screen-levels" class="screen">
  <button class="back-btn" onclick="navigate('screen-menu','back')">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    Back
  </button>
  <div class="levels-content">
    <div class="page-title">Level Select</div>
    <div class="levels-progress" id="levelsProgress">12 Levels &bull; 0/36 Stars</div>
    <div class="levels-grid" id="levelsGrid"></div>
  </div>
</div>

<!-- ═══ HUD ═══ -->
<div id="screen-hud" class="screen">
  <div class="hud-bg"></div>
  <div class="hud-track-surface"></div>
  <div class="hud-top-bar">
    <div class="hud-item">
      <span class="hud-timer" id="hudTimer">1:30</span>
    </div>
    <div class="hud-item">
      <div class="hud-fuel-wrap"><div class="hud-fuel-fill caution" id="hudFuel" style="width:100%"></div></div>
    </div>
    <div class="hud-item">
      <div class="hud-icon"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
      <span class="hud-coins" id="hudCoins">0</span>
    </div>
  </div>
  <div class="hud-bottom-bar">
    <div class="hud-speed">
      <span class="hud-speed-val" id="hudSpeed">0</span>
      <span class="hud-speed-unit">KM/H</span>
    </div>
    <button class="hud-pause" onclick="showPause()" title="Pause">
      <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    </button>
  </div>
  <button class="hud-finish" id="hudFinish" onclick="showComplete()">&#9874; FINISH RACE</button>
</div>

<!-- ═══ PAUSE ═══ -->
<div id="screen-pause" class="overlay">
  <div class="pause-modal">
    <div class="pause-title">Paused</div>
    <div class="pause-buttons">
      <button class="btn btn-primary" onclick="resumeGame()">Resume</button>
      <button class="btn" onclick="restartGame()">Restart</button>
      <button class="btn btn-ghost" onclick="quitToMenu()">Main Menu</button>
    </div>
  </div>
</div>

<!-- ═══ LEVEL COMPLETE ═══ -->
<div id="screen-complete" class="overlay">
  <div class="complete-modal">
    <div class="complete-trophy">
      <svg viewBox="0 0 60 60" fill="none">
        <path d="M15 10h30v5c0 8-3 15-7 20s-8 8-8 8-4-3-8-8-7-12-7-20v-5z" fill="var(--gold)" stroke="#cc9900" stroke-width="2"/>
        <path d="M12 10h-2c-3 0-5 2-5 5v2c0 4 3 6 5 6h2" stroke="var(--gold)" stroke-width="2" fill="none"/>
        <path d="M48 10h2c3 0 5 2 5 5v2c0 4-3 6-5 6h-2" stroke="var(--gold)" stroke-width="2" fill="none"/>
        <rect x="22" y="43" width="16" height="7" rx="2" fill="var(--gold)" stroke="#cc9900" stroke-width="1"/>
        <rect x="25" y="50" width="10" height="5" rx="1" fill="#cc9900"/>
        <path d="M20 28c3 6 8 10 10 10s7-4 10-10" stroke="var(--gold)" stroke-width="1.5" fill="none"/>
      </svg>
    </div>
    <div class="complete-title win" id="completeTitle">Level Complete!</div>
    <div class="complete-stars" id="completeStars"></div>
    <div class="complete-stats" id="completeStats"></div>
    <div class="complete-buttons">
      <button class="btn btn-primary" id="completeNextBtn" onclick="nextLevel()">Next Level</button>
      <button class="btn" onclick="restartGame()">Retry</button>
      <button class="btn btn-ghost" onclick="quitToMenu()">Main Menu</button>
    </div>
  </div>
</div>

</div><!-- /.screens -->
<div class="confetti-container" id="confettiContainer"></div>

<script>
// ─── Data ───
const TRUCKS = [
  { name:'Monster Fury', cls:'Class A - Offroad', speed:8, grip:6, power:9, owned:true, price:0 },
  { name:'Iron Claw', cls:'Class B - Rock Crawler', speed:7, grip:8, power:7, owned:false, price:3000 },
  { name:'Thunder Beast', cls:'Class A - Mud Racer', speed:9, grip:5, power:8, owned:false, price:5000 },
  { name:'Desert Stalker', cls:'Class S - Rally', speed:10, grip:7, power:6, owned:false, price:8000 },
  { name:'Arctic Pounder', cls:'Class B - Ice', speed:6, grip:9, power:8, owned:false, price:6500 },
];

const LEVEL_COUNT = 12;

const app = {
  truckIndex:0, coins:12500,   soundOn:true, paused:false,
  hudTimer:90, hudFuel:100, hudSpeed:0, hudCoins:0, hudActive:false,
  levelStars:{},
  levelUnlocked:{1:true,2:true,3:true},
  completedLevel:null,
  hudInterval:null, speedInterval:null, finishTimer:null,
  transitioning:false,
};

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

// ─── Init ───
function init() {
  initParticles();
  generateLevels();
  renderGarage();
  animateLoading();
}
document.addEventListener('DOMContentLoaded',init);

// ─── Particles ───
function initParticles() {
  document.querySelectorAll('.particles').forEach(container => {
    const count = container.closest('#screen-menu') ? 35 : container.closest('.screen') ? 20 : 0;
    for(let i=0;i<count;i++){
      const el=document.createElement('div'); el.className='particle';
      el.style.left=rand(0,100)+'%';
      el.style.width=el.style.height=rand(2,4)+'px';
      el.style.animationDuration=rand(6,14)+'s';
      el.style.animationDelay=rand(0,10)+'s';
      el.style.opacity=(Math.random()*0.3+0.1).toFixed(2);
      container.appendChild(el);
    }
  });
}

// ─── Navigation ───
function navigate(targetId,dir){
  if(app.transitioning) return;
  app.transitioning=true;
  const current=document.querySelector('.screen.active');
  const target=document.getElementById(targetId);
  if(!target) return;

  // Hide pause/complete overlays
  document.querySelectorAll('.overlay.active').forEach(o=>o.classList.remove('active'));

  if(current){
    current.classList.add(dir==='forward'?'exit-left':'exit-right');
    current.classList.remove('active');
    current.style.pointerEvents='none';
    setTimeout(()=>{
      current.classList.remove('exit-left','exit-right');
      current.style.display='none';
    },500);
  }

  target.style.display='flex';
  // Force reflow
  void target.offsetWidth;
  if(dir==='forward') target.classList.add('enter-right');
  else target.classList.add('enter-left');
  target.classList.add('active');

  requestAnimationFrame(()=>{
    target.classList.remove('enter-right','enter-left');
  });

  setTimeout(()=>{
    app.transitioning=false;
  },500);

  // Screen-specific init
  if(targetId==='screen-hud') initHUD();
  else if(targetId==='screen-levels'){ generateLevels(); updateLevelsProgress(); }
  else if(targetId==='screen-garage') renderGarage();
  else stopHUD();
}

// ─── Loading ───
function animateLoading(){
  const bar=document.getElementById('loadingBar');
  let p=0;
  const iv=setInterval(()=>{
    p+=2;
    bar.style.width=Math.min(p,100)+'%';
    if(p>=100){
      clearInterval(iv);
      setTimeout(()=>navigate('screen-menu','forward'),300);
    }
  },25);
}

// ─── Garage ───
function renderGarage(){
  const t=TRUCKS[app.truckIndex];
  document.getElementById('truckName').textContent=t.name;
  document.getElementById('truckClass').textContent=t.cls;
  const hue=app.truckIndex*60;
  document.getElementById('truckSvg').querySelectorAll('path[fill^="var(--accent)"]').forEach(p=>{
    p.setAttribute('fill',`hsl(${hue+20},90%,55%)`);
  });
  const statsEl=document.getElementById('garageStats');
  statsEl.innerHTML='';
  [
    {label:'Speed',val:t.speed,color:'var(--accent)'},
    {label:'Grip',val:t.grip,color:'var(--green)'},
    {label:'Power',val:t.power,color:'var(--red)'},
  ].forEach(s=>{
    const row=document.createElement('div'); row.className='stat-row';
    row.innerHTML=`
      <div class="stat-label">${s.label}</div>
      <div class="stat-track"><div class="stat-fill" style="width:0%;background:${s.color}"></div></div>
      <div class="stat-num">${s.val}/10</div>
    `;
    statsEl.appendChild(row);
    requestAnimationFrame(()=>{
      row.querySelector('.stat-fill').style.width=(s.val/10*100)+'%';
    });
  });
  const btns=document.getElementById('garageButtons');
  btns.innerHTML='';
  if(t.owned){
    const b=document.createElement('button'); b.className='btn btn-primary'; b.textContent='Selected';
    btns.appendChild(b);
  } else {
    const b=document.createElement('button'); b.className='btn btn-primary';
    b.innerHTML=`<span class="garage-price"><span>$</span>${t.price.toLocaleString()}</span>`;
    b.onclick=()=>buyTruck();
    btns.appendChild(b);
  }
}

function nextTruck(){app.truckIndex=(app.truckIndex+1)%TRUCKS.length;renderGarage();}
function prevTruck(){app.truckIndex=(app.truckIndex-1+TRUCKS.length)%TRUCKS.length;renderGarage();}
function buyTruck(){
  const t=TRUCKS[app.truckIndex];
  if(app.coins>=t.price){app.coins-=t.price;t.owned=true;renderGarage();}
  else alert('Not enough coins!');
}

// ─── Level Select ───
function generateLevels(){
  const names=['Mud Pit','Rock Canyon','Thunder Pass','Bog Run','Boulder Dash','Cliff Hanger','Mountain Rush','Swamp Cross','Valley Run','Summit Climb','River Rage','Volcano Drop'];
  const grid=document.getElementById('levelsGrid');
  grid.innerHTML='';
  for(let i=1;i<=LEVEL_COUNT;i++){
    const card=document.createElement('div'); card.className='level-card';
    const unlocked=app.levelUnlocked[i];
    const stars=app.levelStars[i]||0;
    if(!unlocked) card.classList.add('locked');
    else if(stars>0) card.classList.add('completed');
    card.innerHTML=`
      <div class="level-num" style="color:${unlocked?'var(--accent)':'var(--text-muted)'}">${i}</div>
      <div class="level-name">${names[i-1]||'Level '+i}</div>
      <div class="level-stars">${[1,2,3].map(s=>`<svg viewBox="0 0 24 24" fill="${s<=stars?'var(--gold)':'var(--text-muted)'}" opacity="${s<=stars?'1':'0.2'}"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`).join('')}</div>
      ${!unlocked?'<div class="level-lock"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg></div>':''}
    `;
    if(unlocked) card.onclick=()=>{app.completedLevel=i;navigate('screen-hud','forward');};
    grid.appendChild(card);
  }
}

function updateLevelsProgress(){
  const total=Object.values(app.levelStars).reduce((a,b)=>a+b,0);
  document.getElementById('levelsProgress').textContent=`${LEVEL_COUNT} Levels • ${total}/36 Stars`;
}

// ─── HUD ───
function initHUD(){
  stopHUD();
  app.hudTimer=90;
  app.hudFuel=100;
  app.hudSpeed=0;
  app.hudCoins=0;
  app.hudActive=true;
  document.getElementById('hudTimer').textContent='1:30';
  document.getElementById('hudTimer').classList.remove('urgent');
  document.getElementById('hudFuel').style.width='100%';
  document.getElementById('hudFuel').className='hud-fuel-fill caution';
  document.getElementById('hudCoins').textContent='0';
  document.getElementById('hudSpeed').textContent='0';
  document.getElementById('hudFinish').classList.remove('visible');

  app.hudInterval=setInterval(()=>{
    if(!app.hudActive||app.transitioning||app.paused) return;
    if(app.hudTimer>0){
      app.hudTimer--;
      const m=Math.floor(app.hudTimer/60);
      const s=app.hudTimer%60;
      document.getElementById('hudTimer').textContent=m+':'+(s<10?'0':'')+s;
      if(app.hudTimer<=10) document.getElementById('hudTimer').classList.add('urgent');
      if(app.hudTimer<=0) showComplete();
    }
    app.hudFuel=Math.max(0,app.hudFuel-0.3);
    const f=document.getElementById('hudFuel');
    f.style.width=app.hudFuel+'%';
    f.className='hud-fuel-fill'+(app.hudFuel<20?' danger':app.hudFuel<50?' caution':'');
    if(Math.random()<0.1){
      app.hudCoins+=rand(1,5);
      document.getElementById('hudCoins').textContent=app.hudCoins;
    }
  },1000);

  app.speedInterval=setInterval(()=>{
    if(!app.hudActive||app.transitioning||app.paused) return;
    const target=app.hudFuel>0?rand(30,120):0;
    app.hudSpeed+=(target-app.hudSpeed)*0.15;
    if(Math.abs(app.hudSpeed-target)<1) app.hudSpeed=target;
    document.getElementById('hudSpeed').textContent=Math.round(app.hudSpeed);
  },100);

  app.finishTimer=setTimeout(()=>{
    document.getElementById('hudFinish').classList.add('visible');
  },5000);
}

function stopHUD(){
  app.hudActive=false;
  if(app.hudInterval){clearInterval(app.hudInterval);app.hudInterval=null;}
  if(app.speedInterval){clearInterval(app.speedInterval);app.speedInterval=null;}
  if(app.finishTimer){clearTimeout(app.finishTimer);app.finishTimer=null;}
  document.getElementById('hudFinish').classList.remove('visible');
}

// ─── Pause ───
function showPause(){
  if(!app.hudActive||app.transitioning) return;
  app.paused=true;
  document.getElementById('screen-pause').classList.add('active');
}
function resumeGame(){
  app.paused=false;
  document.getElementById('screen-pause').classList.remove('active');
}
function restartGame(){
  app.paused=false;
  document.getElementById('screen-pause').classList.remove('active');
  document.getElementById('screen-complete').classList.remove('active');
  initHUD();
}
function quitToMenu(){
  app.paused=false;
  document.getElementById('screen-pause').classList.remove('active');
  document.getElementById('screen-complete').classList.remove('active');
  navigate('screen-menu','back');
}

// ─── Level Complete ───
function showComplete(){
  stopHUD();
  const won=app.hudTimer>0;
  const stars=won?Math.min(3,app.hudTimer>60?3:app.hudTimer>30?2:1):0;
  const prevStars=app.levelStars[app.completedLevel]||0;
  if(stars>prevStars) app.levelStars[app.completedLevel]=stars;
  if(app.completedLevel<LEVEL_COUNT&&!app.levelUnlocked[app.completedLevel+1]) app.levelUnlocked[app.completedLevel+1]=true;

  document.getElementById('completeTitle').textContent=won?'Level Complete!':'Level Failed';
  document.getElementById('completeTitle').className='complete-title '+(won?'win':'lose');
  document.getElementById('completeNextBtn').textContent=app.completedLevel<LEVEL_COUNT?'Next Level':'Back to Levels';
  document.getElementById('completeNextBtn').onclick=()=>{
    document.getElementById('screen-complete').classList.remove('active');
    if(app.completedLevel<LEVEL_COUNT){
      app.completedLevel++;
      app.levelUnlocked[app.completedLevel]=true;
      navigate('screen-hud','forward');
    } else {
      navigate('screen-levels','back');
    }
  };

  const cStars=document.getElementById('completeStars');
  cStars.innerHTML='';
  for(let i=0;i<3;i++){
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 24 24');
    svg.setAttribute('fill',i<stars?'var(--gold)':'var(--text-muted)');
    if(i>=stars) svg.classList.add('dim');
    svg.innerHTML='<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>';
    if(i<stars){
      svg.style.transform='scale(0)'; svg.style.transition='transform 0.4s cubic-bezier(0.34,1.56,0.64,1)';
      setTimeout(()=>{svg.style.transform='scale(1)';},300+i*400);
    }
    cStars.appendChild(svg);
  }

  document.getElementById('completeStats').innerHTML=`
    <div class="complete-stat"><div class="complete-stat-val">${Math.floor((90-app.hudTimer)/60)}:${((90-app.hudTimer)%60)<10?'0':''}${(90-app.hudTimer)%60}</div><div class="complete-stat-label">Time</div></div>
    <div class="complete-stat"><div class="complete-stat-val">${app.hudCoins}</div><div class="complete-stat-label">Coins</div></div>
    <div class="complete-stat"><div class="complete-stat-val" style="color:var(--gold)">${stars}/3</div><div class="complete-stat-label">Stars</div></div>
  `;

  document.getElementById('screen-complete').classList.add('active');
  if(won) spawnConfetti();
  else clearConfetti();
}

function nextLevel(){
  document.getElementById('screen-complete').classList.remove('active');
  navigate('screen-levels','back');
}

// ─── Confetti ───
function spawnConfetti(){
  clearConfetti();
  const c=document.getElementById('confettiContainer');
  const colors=['var(--gold)','var(--accent)','var(--red)','var(--green)','#ff66cc','#66ccff','#ffcc00'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div'); el.className='confetti-piece';
    el.style.left=rand(0,100)+'%';
    el.style.background=colors[rand(0,colors.length-1)];
    el.style.width=rand(6,12)+'px';
    el.style.height=rand(6,12)+'px';
    el.style.borderRadius=Math.random()>0.5?'50%':'2px';
    el.style.animationDuration=rand(2,5)+'s';
    el.style.animationDelay=rand(0,3)+'s';
    c.appendChild(el);
  }
}
function clearConfetti(){
  document.getElementById('confettiContainer').innerHTML='';
}

// ─── Sound Toggle ───
function toggleSound(){
  app.soundOn=!app.soundOn;
  document.getElementById('soundBtn').classList.toggle('muted',!app.soundOn);
}

// ─── Settings (simple alert) ───
function showSettings(){
  alert('Settings: Sound '+(app.soundOn?'ON':'OFF')+'\n\n(Full settings panel coming in next iteration)');
}

// ─── Keyboard shortcuts ───
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('screen-pause').classList.contains('active')) resumeGame();
    else if(document.getElementById('screen-complete').classList.contains('active')){/* stay */}
    else if(document.querySelector('.screen.active')?.id!=='screen-menu') navigate('screen-menu','back');
  }
  if(e.key==='Enter'){
    const menu=document.getElementById('screen-menu');
    if(menu.classList.contains('active')&&!document.querySelector('.overlay.active')) navigate('screen-levels','forward');
  }
});
</script>
</body>
</html>
