<script>
(function() {
    var _baseFetch = window.fetch ? window.fetch.bind(window) : null;
    function gmFetch(input, init) {
        var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
        if (url.indexOf('.github.io') !== -1) {
            return new Promise(function(resolve, reject) {
                var xhr = new XMLHttpRequest();
                xhr.open((init && init.method) || 'GET', url, true);
                if (init && init.headers) {
                    try {
                        if (typeof init.headers.forEach === 'function') {
                            init.headers.forEach(function(v, k) { xhr.setRequestHeader(k, v); });
                        } else {
                            Object.keys(init.headers).forEach(function(k) { xhr.setRequestHeader(k, init.headers[k]); });
                        }
                    } catch(e) {}
                }
                xhr.responseType = 'arraybuffer';
                xhr.onload = function() {
                    resolve({
                        ok: xhr.status >= 200 && xhr.status < 300,
                        status: xhr.status,
                        statusText: xhr.statusText,
                        arrayBuffer: function() { return Promise.resolve(xhr.response); },
                        json: function() { try { return Promise.resolve(JSON.parse(xhr.responseText)); } catch(e) { return Promise.reject(e); } },
                        text: function() { return Promise.resolve(xhr.responseText); },
                        headers: { get: function() { return null; }, forEach: function() {} }
                    });
                };
                xhr.onerror = function() { reject(new Error('Network error')); };
                xhr.send((init && init.body) || null);
            });
        }
        return _baseFetch ? _baseFetch(input, init) : Promise.reject(new Error('No fetch'));
    }
    window.fetch = gmFetch;
    try {
        Object.defineProperty(window, 'fetch', {
            get: function() { return gmFetch; },
            set: function(v) { window._blockedAntFetch = v; },
            configurable: false
        });
    } catch(e) {}
})();
</script>

            resolveLanguage: function() {
                try { return document.documentElement.lang || "en"; } catch(e) { return "en"; }
            },
            resolveServerPurchases: function() { return Promise.resolve([]); },
            setScore: function() {},
            writeCacheSaves: function(tag, json) { cache[tag] = json; },
            writeSaves: function() { return Promise.resolve(); }
        };
    })();
</script>
<script type="text/javascript">
        function onRuntimeDataReady() {
            console.log("runtimeData is ready");

            document.title = runtimeData.productName;

            let rotationLockScript = document.createElement("script");
            rotationLockScript.src = "lib/rotationLock.js";
            window.onload = () => {
                rotationLock.create(runtimeData.rotationLockType);
            };
            document.head.appendChild(rotationLockScript);

            if (runtimeData.debugMode == true) {
                let erudaScript = document.createElement("script");
                erudaScript.src = "lib/eruda.js";
                erudaScript.onload = () => {
                    eruda.init();
                };
                document.head.appendChild(erudaScript);
            }
        }
    </script>
<script type="text/javascript" src="lib/runtimeData.js" onload="onRuntimeDataReady()"></script>
