<script src="gameloader.js"></script>
<link rel="stylesheet" type="text/css" href="style.css"/>
<script>
window.alert = function(_log){console.log(_log);};

function xhrDownload(url, onProgress) {
    return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.responseType = "arraybuffer";
        xhr.onprogress = function(e) {
            if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total);
        };
        xhr.onload = function() {
            if (xhr.status >= 200 && xhr.status < 300) resolve(new Blob([xhr.response]));
            else reject(new Error("XHR failed " + xhr.status));
        };
        xhr.onerror = function() { reject(new Error("Network error")); };
        xhr.send();
    });
}

document.addEventListener('DOMContentLoaded', function() {
    var buildJsonUrl = "Build/build.json";

    xhrDownload(buildJsonUrl).then(function(blob) {
        return new Promise(function(resolve) {
            var reader = new FileReader();
            reader.onload = function() { resolve(JSON.parse(reader.result)); };
            reader.readAsText(blob);
        });
    }).then(function(config) {
        var base = "Build/";
        var filesToFetch = [];
        if (config.dataUrl) filesToFetch.push({ key: "dataUrl", url: base + config.dataUrl });
        if (config.wasmCodeUrl) filesToFetch.push({ key: "wasmCodeUrl", url: base + config.wasmCodeUrl });
        if (config.wasmFrameworkUrl) filesToFetch.push({ key: "wasmFrameworkUrl", url: base + config.wasmFrameworkUrl });

        var done = 0;
        var total = filesToFetch.length || 1;

        function checkDone() {
            done++;
            if (done >= total) {
                var blobUrl = URL.createObjectURL(new Blob([JSON.stringify(config)], {type: "application/json"}));
                window.unityInstance = UnityLoader.instantiate("unityContainer", blobUrl);
            }
        }

        if (filesToFetch.length === 0) {
            checkDone();
            return;
        }

        filesToFetch.forEach(function(f) {
            xhrDownload(f.url, function(p) {
                console.log("[gangster-v] " + f.url + ": " + Math.round(p * 100) + "%");
            }).then(function(blob) {
                config[f.key] = URL.createObjectURL(blob);
                console.log("[gangster-v] " + f.key + " ready: " + blob.size + " bytes");
                checkDone();
            }).catch(function(e) {
                console.warn("[gangster-v] " + f.url + " failed: " + e.message);
                checkDone();
            });
        });
    }).catch(function(e) {
        console.warn("[gangster-v] build.json fetch failed: " + e.message + ", using direct URL");
        window.unityInstance = UnityLoader.instantiate("unityContainer", buildJsonUrl);
    });
});
</script>
