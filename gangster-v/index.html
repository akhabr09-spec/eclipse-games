<script>
(function() {
    var _nativeFetch = window.fetch;
    window.fetch = function(input, init) {
        var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
        var blobMatch = url.match(/(blob:[^\s"']+)/);
        if (blobMatch && blobMatch[1] !== url) {
            input = blobMatch[1];
        }
        if (typeof input === 'string' && input.indexOf('github.io') !== -1) {
            return new Promise(function(resolve, reject) {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', input, true);
                xhr.responseType = 'arraybuffer';
                xhr.onload = function() {
                    var headers = {};
                    var ct = xhr.getResponseHeader('Content-Type');
                    if (ct) headers['Content-Type'] = ct;
                    var ce = xhr.getResponseHeader('Content-Encoding');
                    if (ce) headers['Content-Encoding'] = ce;
                    resolve(new Response(xhr.response, {
                        status: xhr.status,
                        statusText: xhr.statusText || 'OK',
                        headers: headers
                    }));
                };
                xhr.onerror = function() { reject(new Error('Network error')); };
                xhr.send();
            });
        }
        return _nativeFetch.call(window, input, init);
    };
})();
</script>

<script>
window.alert = function(_log){console.log(_log);};

var GH_BASE = "https://akhabr09-spec.github.io/eclipse-games/gangster-v/";

function xhrDownload(url) {
    return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.responseType = "arraybuffer";
        xhr.onload = function() {
            if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.response);
            else reject(new Error("XHR failed " + xhr.status));
        };
        xhr.onerror = function() { reject(new Error("Network error")); };
        xhr.send();
    });
}

document.addEventListener('DOMContentLoaded', function() {
    var buildJsonUrl = GH_BASE + "Build/build.json";

    xhrDownload(buildJsonUrl).then(function(buf) {
        var decoder = new TextDecoder();
        var config = JSON.parse(decoder.decode(new Uint8Array(buf)));

        // Rewrite all relative URLs to absolute GitHub Pages URLs
        var keys = ["dataUrl", "wasmCodeUrl", "wasmFrameworkUrl", "frameworkUrl", "codeUrl", "memoryUrl", "audioUrl"];
        keys.forEach(function(k) {
            if (config[k] && config[k].indexOf("http") !== 0) {
                config[k] = GH_BASE + "Build/" + config[k];
            }
        });

        var blobUrl = URL.createObjectURL(new Blob([JSON.stringify(config)], {type: "application/json"}));
        window.unityInstance = UnityLoader.instantiate("unityContainer", blobUrl);
    }).catch(function(e) {
        console.warn("[gangster-v] build.json fetch failed: " + e.message);
    });
});
</script>
